scope: qwen_repair_gate
variant: QWEN_VL_LM_GATE_V3_B_8GPU
data:
  expanded_manifest: true
  manifest_schema: qwen-repair-gate-v2
  reason_contract: DECISION_REPAIR_KEEP_PLUS_REASONS_V3_EOS
  train_manifest: data/router/train.jsonl
  validation_manifest: data/router/demo_validation.jsonl
  secondary_validation_manifest: data/router/validation.jsonl
  data_root: .
  texverse_root: data/TexVerse
  texverse_full_root: data/TexVerse-full
  expected_train_examples: null
  expected_validation_examples: null
  expected_secondary_validation_examples: null
  demo_validation: true
  image_sample_size: 512
  condition_image_size: 147456
model:
  pretrained_model_path: models/FireRed-Image-Edit-1.1
  trainable_language_layers:
  - 24
  - 27
  train_final_norm: true
  train_lm_head: false
  train_vision_encoder: false
  vision_lora:
    enabled: true
    target_blocks:
    - 28
    - 29
    - 30
    - 31
    target_suffixes:
    - attn.qkv
    - attn.proj
    - mlp.gate_proj
    - mlp.up_proj
    - mlp.down_proj
    rank: 16
    alpha: 32
    dropout: 0.05
  dtype: bfloat16
  gradient_checkpointing: true
prompt:
  path: gate3dgen/resources/prompts/router.json
loss:
  structure_token_weight: 0.5
  decision_token_weight: 3.0
  reason_token_weight: 1.0
  eos_token_weight: 5.0
  eos_token_id: 151645
  duplicate_reason_policy: reject
  unlikelihood_loss: false
sample_weights:
  path: data/router/weights/sample_weights.jsonl
  family_weights:
    animal_motion_blur: 2.0
    overexposure: 1.75
    shadow: 1.5
    white_balance: 1.5
    local_color_spill: 1.5
    optical_blur: 1.5
    default: 1.0
  subtle_multiplier: 1.25
  max_sample_weight: 2.5
  require_subtle_proxy: true
  subtle_proxy_status: ok_rmbg2_mask_sidecar_bottom25
  heavy_semantics: provenance_only_never_subtle
training:
  seed: 42
  num_processes: 8
  num_machines: 1
  num_processes_per_machine: 8
  main_process_port: 29564
  per_device_batch_size: 1
  gradient_accumulation_steps: 4
  num_workers: 2
  max_train_steps: 6000
  learning_rate: 1.0e-06
  vision_lora_learning_rate_multiplier: 10.0
  vision_lora_weight_decay: 0.0
  weight_decay: 0.01
  warmup_steps: 300
  max_grad_norm: 1.0
  logging_steps: 10
  validation_steps: 500
  checkpointing_steps: 500
  checkpoints_total_limit: 5
paths:
  output_dir: outputs/training/router
