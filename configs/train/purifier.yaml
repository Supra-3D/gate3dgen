scope: full
variant: V3_RESTORATION_RMBG2_GATE_B
recipe: v2
data:
  manifests:
    train: data/manifests/train.jsonl
    validation: data/manifests/validation.jsonl
    test: data/manifests/test.jsonl
  data_root: outputs/pairs
  subject_mask_root: outputs/masks
  subject_mask_required: true
  subject_mask_schema: texverse-clean-gt-rmbg2-soft-mask-v1
model:
  pretrained_model_path: models/FireRed-Image-Edit-1.1
  resolution: 1024
  architecture: restoration_custom
  attention_backend: auto
  lora_rank: 128
  lora_alpha: 128
  lora_dropout: 0.0
condition_model:
  enabled: true
  role: B
  variant: QWEN_VL_LM_GATE_V3_B_8GPU
  checkpoint_path: checkpoints/router/checkpoint-6000
  model_path: checkpoints/router/checkpoint-6000/exported_model
  checkpoint_step: 6000
  source_world_size: 8
  model_hash: auto
  valid_token_prefix_trim: 64
  dtype: bfloat16
embedding:
  num_processes: 8
  num_workers: 2
training:
  mode: partial_unfreeze
  trainable_block_range:
  - 29
  - 49
  use_fsdp: true
  seed: 42
  num_processes: 32
  num_machines: 4
  num_processes_per_machine: 8
  main_process_port: 29532
  num_workers: 2
  batch_size: 1
  gradient_accumulation_steps: 1
  max_train_steps: 15000
  learning_rate: 5.0e-07
  lr_scheduler: cosine
  warmup_steps: 500
  checkpointing_steps: 500
  checkpoints_total_limit: 5
  vae_encode_mode: mode
loss:
  objective: hybrid_x0_pixel
  restoration_v3: true
  flow_weight: 0.0
  latent_x0_weight: 0.1
  pixel_l1_weight: 0.0
  pixel_lpips_weight: 0.5
  pixel_loss_fg_only: false
  pixel_background_weight: 0.0
  pixel_full_l1_weight: 1.0
  pixel_subject_l1_weight: 1.0
  pixel_affected_l1_weight: 1.0
  pixel_subject_gradient_weight: 1.0
  x0_sigma_band:
  - 1.0
  - 1.0
prompt_library:
  path: gate3dgen/resources/prompts/purifier.json
  id: gate3dgen_purify_input_v1
inference:
  steps: 1
  true_cfg_scale: 1.0
  negative_prompt: ' '
  seed: 1234
  samples_per_task: 1
paths:
  cache_root: outputs/cache/purifier
  output_dir: outputs/training/purifier
